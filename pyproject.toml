[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localpro-enclave"
version = "0.1.0"
description = "MCP server for Alexa+ that finds, quotes, books, and verifies trusted local home-service pros."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
localpro-enclave = "localpro.server:main"

[tool.setuptools]
packages = ["localpro"]

[tool.setuptools.package-data]
localpro = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
